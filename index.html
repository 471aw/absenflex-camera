<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Verifikasi Wajah</title>
<style>
:root{--bg:#07111f;--fg:#f5f7fa;--muted:#a8b3c0;--p:#4e8cff;--ok:#45d483;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:14px}.title{font-weight:800;font-size:19px}.sub{color:var(--muted);font-size:13px;margin:3px 0 12px}.stage{position:relative;overflow:hidden;border-radius:22px;background:#000;aspect-ratio:3/4;max-height:72vh}.stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.oval{position:absolute;left:14%;right:14%;top:16%;bottom:19%;border:3px solid rgba(255,255,255,.75);border-radius:48% 48% 43% 43%;box-shadow:0 0 0 999px rgba(0,0,0,.23)}.badge{position:absolute;left:12px;right:12px;bottom:12px;padding:11px 12px;border-radius:14px;background:rgba(5,12,22,.82);backdrop-filter:blur(7px);text-align:center;font-weight:700}.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}.bar{height:5px;background:#1c2a3a;border-radius:99px;margin:12px 0;overflow:hidden}.bar>div{height:100%;width:0;background:var(--p);transition:width .25s}.help{color:var(--muted);font-size:12px;text-align:center}button{width:100%;border:0;border-radius:12px;padding:11px;background:#26384d;color:#fff;font:inherit;font-weight:700;margin-top:10px}.hidden{display:none!important}
</style></head><body><div class="wrap"><div id="cameraTitle" class="title">Verifikasi Wajah</div><div id="sub" class="sub">Menyiapkan kamera dan model wajah…</div><div class="stage"><video id="video" autoplay muted playsinline></video><div class="oval"></div><div id="badge" class="badge">Memuat…</div></div><div class="bar"><div id="prog"></div></div><div id="help" class="help">Pastikan hanya satu wajah terlihat dan pencahayaan cukup.</div><button id="cancel" onclick="fail('Dibatalkan pengguna')">Batal</button></div>
<script src="vendor/face-api.js"></script>
<script>
const q=new URLSearchParams(location.search), MODE=q.get('mode')||'attendance', REQUEST_ID=q.get('requestId')||'', RETURN_ORIGIN=q.get('returnOrigin')||'*', CHALLENGE_POSE=String(q.get('challengePose')||'STRAIGHT').toUpperCase(), APP_NAME=(String(q.get('appName')||'Absensi').trim().slice(0,80)||'Absensi');
const MODEL='./model';const video=document.getElementById('video'),badge=document.getElementById('badge'),sub=document.getElementById('sub'),prog=document.getElementById('prog');let stream=null,stopped=false;const cameraTitle=document.getElementById('cameraTitle');cameraTitle.textContent=APP_NAME+' • Verifikasi Wajah';document.title=APP_NAME+' • Verifikasi Wajah';
const opts=()=>new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.58});
function setBadge(t,kind=''){badge.textContent=t;badge.className='badge '+kind}function progress(n){prog.style.width=Math.max(0,Math.min(100,n))+'%'}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function avg(arr,key){return arr.reduce((s,p)=>s+p[key],0)/arr.length}
function yawProxy(lm){const le=lm.getLeftEye(),re=lm.getRightEye(),nose=lm.getNose();const lx=avg(le,'x'),rx=avg(re,'x'),mid=(lx+rx)/2,ed=Math.max(1,Math.abs(rx-lx));const tip=nose[Math.min(3,nose.length-1)];return (tip.x-mid)/ed}
function photo(){const c=document.createElement('canvas');let w=video.videoWidth||480,h=video.videoHeight||640;const max=480;if(w>max){h=Math.round(h*max/w);w=max}c.width=w;c.height=h;c.getContext('2d').drawImage(video,0,0,w,h);return c.toDataURL('image/jpeg',.67)}
async function detect(){const r=await faceapi.detectSingleFace(video,opts()).withFaceLandmarks().withFaceDescriptor();if(!r)return null;const b=r.detection.box;if(b.width<(video.videoWidth||480)*.20)return null;return r}
async function gps(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('Geolocation tidak tersedia'));navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,mock:false,source:'WEB_GEOLOCATION'}),e=>reject(new Error('GPS gagal: '+e.message)),{enableHighAccuracy:true,maximumAge:0,timeout:15000})})}
function send(ok,payload,error){if(stopped)return;stopped=true;try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}const msg={source:'ABSENFLEX_CAMERA',requestId:REQUEST_ID,ok:ok,payload:payload||null,error:error||''};try{window.opener&&window.opener.postMessage(msg,RETURN_ORIGIN)}catch(e){}setTimeout(()=>window.close(),500)}function fail(e){const text=String(e&&e.message?e.message:e);if(!window.opener){stopped=true;setBadge(text,'bad');sub.textContent='Buka halaman verifikasi dari '+APP_NAME+'.';return;}send(false,null,text)}
async function stableCapture(predicate,label,timeout=18000,holdFrames=3){setBadge(label);let good=0,last=null,start=Date.now();while(Date.now()-start<timeout&&!stopped){const r=await detect();if(!r){good=0;setBadge('Wajah belum terbaca','bad');await sleep(170);continue}const y=yawProxy(r.landmarks);if(predicate(y,r)){good++;last={r,y};setBadge(label+' • tahan…');if(good>=holdFrames){return {descriptor:Array.from(r.descriptor),photo:photo(),yaw:y}}}else{good=0;setBadge(label)}await sleep(170)}throw new Error('Posisi wajah tidak terbaca sesuai petunjuk.');}
function posePredicate(pose,baseYaw){if(pose==='RIGHT')return y=>(y-baseYaw)<-.10;if(pose==='LEFT')return y=>(y-baseYaw)>.10;if(pose==='STRAIGHT')return y=>Math.abs(y-baseYaw)<.08;throw new Error('Challenge posisi wajah tidak valid.');}
function poseLabel(pose){return {RIGHT:'Tengok ke KANAN Anda',LEFT:'Tengok ke KIRI Anda',STRAIGHT:'Tetap lihat LURUS'}[pose]||'Ikuti instruksi';}
async function enroll(){sub.textContent='Pendaftaran Face ID: lurus, kanan, lalu kiri. Tidak menggunakan kedipan.';const a=await stableCapture(y=>Math.abs(y)<.18,'1/3 • Lihat LURUS ke kamera');progress(42);await sleep(550);const b=await stableCapture(y=>(y-a.yaw)<-.10,'2/3 • Tengok ke KANAN Anda');progress(70);await sleep(550);const c=await stableCapture(y=>(y-a.yaw)>.10,'3/3 • Tengok ke KIRI Anda');progress(100);setBadge('Face ID siap disimpan','ok');send(true,{descriptors:[a.descriptor,b.descriptor,c.descriptor],photos:[a.photo,b.photo,c.photo],liveness:{method:'POSE_ENROLL',initialStraight:true,right:true,left:true,straightYaw:a.yaw,rightYaw:b.yaw,leftYaw:c.yaw,capturedAt:new Date().toISOString()}})}
async function attendance(){if(!['RIGHT','LEFT','STRAIGHT'].includes(CHALLENGE_POSE))throw new Error('Challenge wajah tidak valid.');sub.textContent='Tahap 1: wajah lurus. Tahap 2 akan mengikuti instruksi acak.';const a=await stableCapture(y=>Math.abs(y)<.18,'1/2 • Lihat LURUS ke kamera');progress(48);setBadge('Tahap pertama berhasil','ok');await sleep(CHALLENGE_POSE==='STRAIGHT'?1200:650);sub.textContent='Tahap 2: '+poseLabel(CHALLENGE_POSE)+'.';const b=await stableCapture(posePredicate(CHALLENGE_POSE,a.yaw),'2/2 • '+poseLabel(CHALLENGE_POSE),18000,CHALLENGE_POSE==='STRAIGHT'?5:3);progress(78);setBadge('Mengambil GPS…');const location=await gps();progress(100);setBadge('Verifikasi selesai','ok');send(true,{descriptor:a.descriptor,challengeDescriptor:b.descriptor,photo:a.photo,liveness:{method:'STRAIGHT_THEN_RANDOM_POSE',initialStraight:true,challengePassed:true,challengePose:CHALLENGE_POSE,straightYaw:a.yaw,challengeYaw:b.yaw,capturedAt:new Date().toISOString()},location})}

function chromeMobileGate(){
  const ua=String(navigator.userAgent||'');
  const uaData=navigator.userAgentData||null;
  const isIOS=/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const iosChrome=isIOS && /CriOS\/\d+/i.test(ua) && !/(FxiOS|EdgiOS|OPiOS|DuckDuckGo)/i.test(ua);
  let androidChrome=false;
  if(isAndroid){
    const obviousOther=/(EdgA|OPR\/|Opera|SamsungBrowser|UCBrowser|YaBrowser|Firefox|DuckDuckGo)/i.test(ua);
    if(!obviousOther && /Chrome\/\d+/i.test(ua)){
      androidChrome=true;
      if(uaData && Array.isArray(uaData.brands)){
        const brands=uaData.brands.map(x=>String(x.brand||'').toLowerCase());
        if(brands.length && !brands.some(x=>x==='google chrome')) androidChrome=false;
        if(brands.some(x=>/(edge|opera|brave|samsung)/i.test(x))) androidChrome=false;
      }
      if(navigator.brave) androidChrome=false;
    }
  }
  return iosChrome || androidChrome;
}
async function init(){try{if(!chromeMobileGate())throw new Error('Gunakan Google Chrome pada Android atau iPhone. Browser lain diblokir.');if(!window.opener)throw new Error('Halaman kamera harus dibuka dari aplikasi '+APP_NAME+'.');if(!window.isSecureContext)throw new Error('Kamera memerlukan HTTPS.');await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)]);progress(12);stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:800}}});video.srcObject=stream;await video.play();sub.textContent='Model wajah siap. Ikuti instruksi di layar.';progress(20);if(MODE==='enroll')await enroll();else await attendance()}catch(e){fail(e)}}
window.addEventListener('beforeunload',()=>{try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}});init();
</script></body></html>
